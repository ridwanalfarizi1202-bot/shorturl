<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short URLs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans
  bg-[radial-gradient(60%_60%_at_15%_10%,#2563eb55,transparent_60%),radial-gradient(50%_50%_at_85%_25%,#22c55e55,transparent_60%),radial-gradient(60%_60%_at_70%_90%,#a855f755,transparent_60%)]
  bg-fixed bg-no-repeat">

<main class="mx-auto max-w-2xl px-4 py-8">
  <h1 class="mb-6 font-mono text-2xl">Short URLs</h1>

  <div id="banner" hidden role="alert" tabindex="-1" class="mb-4 rounded-xl border px-4 py-3 backdrop-blur"></div>

  <div class="tabs">
    <input type="radio" name="tab" id="t1" checked>
    <input type="radio" name="tab" id="t2">
    <div class="tabbar mb-4 flex gap-1.5 rounded-xl border border-white/15 bg-white/5 p-1.5" role="tablist">
      <label for="t1" role="tab" class="tab-btn">Single</label>
      <label for="t2" role="tab" class="tab-btn">Batch</label>
    </div>

    <!-- Single -->
    <div class="panel glass p-6" id="p1" role="tabpanel">
      <form id="single">
        <label class="field-label" for="targetUrl">Target URL</label>
        <input class="field" id="targetUrl" name="targetUrl" type="url" required placeholder="https://example.com">

        <label class="field-label mt-4" for="title">Title</label>
        <input class="field" id="title" name="title" placeholder="Tampil saat dibagikan">

        <label class="field-label mt-4" for="description">Description</label>
        <textarea class="field" id="description" name="description" rows="3" placeholder="Tampil saat dibagikan"></textarea>

        <label class="field-label mt-4" for="image">Preview image</label>
        <div id="drop" class="rounded-xl border border-dashed border-white/20 p-1.5 transition-colors">
          <input class="field file:mr-3 file:cursor-pointer file:rounded-md file:border-0 file:bg-emerald-500 file:px-3.5 file:py-1.5 file:font-semibold file:text-emerald-950 hover:file:brightness-110"
                 id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
        </div>
        <p class="mt-1.5 text-xs text-slate-400" id="hint">Drag &amp; drop gambar, atau klik untuk memilih. JPG, PNG, WEBP, GIF (maks. 5 MB).</p>

        <label class="field-label mt-4" for="code">Custom slug</label>
        <input class="field" id="code" name="code" placeholder="otomatis jika kosong">

        <button class="btn" id="singleBtn">Shorten</button>
      </form>
    </div>

    <!-- Batch -->
    <div class="panel glass p-6" id="p2" role="tabpanel">
      <form id="batch">
        <label class="field-label" for="urls">One URL per line</label>
        <textarea class="field font-mono text-sm" id="urls" name="urls" rows="8" required
          placeholder="https://a.com&#10;https://b.com | Judul opsional"></textarea>
        <button class="btn" id="batchBtn">Create all</button>
      </form>
    </div>
  </div>

  <ul id="links" class="mt-8 grid list-none gap-3 p-0">
    <li class="glass p-4 text-slate-400">Memuat link…</li>
  </ul>

  <dialog id="modal" class="glass w-[min(92vw,32rem)] bg-slate-900/85 p-6 text-slate-100">
    <h2 class="mb-4 font-mono text-lg">Berhasil!</h2>
    <div id="modalBody" class="space-y-2"></div>
    <p id="modalNote" class="mt-3 text-sm text-slate-400" hidden></p>
    <form method="dialog"><button class="btn">Tutup</button></form>
  </dialog>
</main>

<script src="/app.js"></script>
</body>
</html>
