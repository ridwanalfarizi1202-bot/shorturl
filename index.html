<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortly — Short URL</title><style>
:root{color-scheme:light;--ink:#172033;--muted:#687386;--line:#e5e9f0;--brand:#635bff;--soft:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:40px 18px 60px}.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.hero{padding:50px 0 26px}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.05;letter-spacing:-2px;margin:18px 0 12px}.hero p{color:var(--muted);font-size:17px;margin:0}.panel,.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #303b5b0b}.panel{padding:22px}.field{margin-bottom:16px}label{display:block;font-weight:650;margin-bottom:7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;color:inherit;outline:none}input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #635bff18}textarea{min-height:86px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}.file{border:1px dashed #cbd2df;padding:14px;background:#fafbfe}.btn{width:100%;border:0;border-radius:10px;background:var(--brand);color:white;padding:13px;font-weight:750;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.result{margin-top:16px;padding:14px;border-radius:10px;background:#eefbf4;color:#187044;word-break:break-all}.error{background:#fff0f0;color:#b42318}.section{margin-top:34px}.section h2{font-size:18px}.card{padding:16px;margin:12px 0}.card a{color:var(--brand);word-break:break-all}.card img{width:90px;height:60px;object-fit:cover;border-radius:8px;margin-top:10px}.meta{color:var(--muted);font-size:13px;margin-top:5px}.empty{color:var(--muted);text-align:center;padding:20px}@media(min-width:620px){.panel{padding:28px}}
</style></head><body><main class="wrap"><div class="brand">shortly<span style="color:var(--brand)">.</span></div><section class="hero"><h1>Link panjang,<br><span style="color:var(--brand)">jadi ringkas.</span></h1><p>Buat short URL yang rapi dengan preview gambar untuk dibagikan.</p></section><section class="panel"><form id="form"><div class="field"><label for="targetUrl">URL tujuan</label><input id="targetUrl" name="targetUrl" type="url" required placeholder="https://website-kamu.com/halaman"></div><div class="field"><label for="title">Judul preview</label><input id="title" name="title" required maxlength="120" placeholder="Judul yang tampil di chat"></div><div class="field"><label for="description">Deskripsi <span class="hint">(opsional)</span></label><textarea id="description" name="description" maxlength="300" placeholder="Deskripsi singkat halaman"></textarea></div><div class="field"><label for="image">Gambar preview <span class="hint">(opsional, maks. 5 MB)</span></label><input class="file" id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><button class="btn" id="submit">Buat short URL</button></form><div id="result" hidden></div></section><section class="section"><h2>Link terbaru</h2><div id="links"><div class="empty">Memuat link...</div></div></section></main><script>
const form=document.querySelector('#form'),button=document.querySelector('#submit'),result=document.querySelector('#result'),links=document.querySelector('#links');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/links');if(!r.ok)throw Error();const data=await r.json();links.innerHTML=data.length?data.map(x=>`<article class="card"><b>${esc(x.title)}</b><div class="meta">${x.clicks||0} klik</div><a href="/${encodeURIComponent(x.code)}">${location.origin}/${esc(x.code)}</a>${x.imageUrl?`<br><img src="${esc(x.imageUrl)}" alt="Preview">`:''}</article>`).join(''):'<div class="empty">Belum ada link. Buat link pertama.</div>'}catch{links.innerHTML='<div class="empty">Gagal memuat link.</div>'}}
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent='Menyimpan...';result.hidden=true;try{const r=await fetch('/api/links',{method:'POST',body:new FormData(form)}),x=await r.json();if(!r.ok)throw Error(x.error||'Gagal menyimpan');result.className='result';result.innerHTML=`Berhasil! <a href="${esc(x.shortUrl)}">${esc(x.shortUrl)}</a>`;result.hidden=false;form.reset();await load()}catch(err){result.className='result error';result.textContent=err.message;result.hidden=false}finally{button.disabled=false;button.textContent='Buat short URL'}};load();
</script></body></html>
